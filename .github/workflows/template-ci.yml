# The template's own CI. init deletes this file; its presence is how init knows a clone is uninitialized.
name: template-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # The variant alone, so each check keeps its name (as-shipped, skeleton, initialized).
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: as-shipped
            run: node scripts/verify.mjs
          - variant: skeleton
            run: node scripts/remove-sample.mjs && node scripts/verify.mjs
          - variant: initialized
            run: >-
              node scripts/init.mjs --yes --name acme-orders --package com.acme.orders
              --display "Acme Orders" --sample keep --ci github
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Global, because init replaces .git and with it any repository-local identity.
      - if: matrix.variant == 'initialized'
        run: |
          git config --global user.name "Template CI"
          git config --global user.email "template-ci@example.invalid"
      - run: ${{ matrix.run }}
