# Template-only release automation, not a check wrapper; init deletes it.
name: release-tag

on:
  # By hand only: TEMPLATE_VERSION lands on main before the version's last changes do.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/release-tag.mjs --sha "$SHA"
        env:
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
