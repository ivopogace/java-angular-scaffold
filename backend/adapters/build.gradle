plugins {
    id 'java-library'
    id 'java-conventions'
}

// Committed output of generateJooq (docs/adr/0003-jooq-for-persistence.md); never edited by hand.
def generatedJooq = layout.projectDirectory.dir('src/generated/jooq')

sourceSets {
    main {
        java {
            srcDir generatedJooq
        }
    }
    // The code generator and its tests: their classpaths (Testcontainers, jooq-codegen, slf4j-simple)
    // stay off the adapters' main and test classpaths.
    jooqCodegen
    jooqCodegenTest {
        compileClasspath += jooqCodegen.output
        runtimeClasspath += jooqCodegen.output
    }
}

configurations {
    jooqCodegenTestImplementation.extendsFrom jooqCodegenImplementation
    jooqCodegenTestRuntimeOnly.extendsFrom jooqCodegenRuntimeOnly
}

dependencies {
    api project(':application-core')
    implementation platform(libs.spring.boot.bom)
    implementation platform(libs.spring.modulith.bom)

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation 'org.springframework.modulith:spring-modulith-starter-jdbc'
    runtimeOnly 'org.postgresql:postgresql'

    jooqCodegenImplementation platform(libs.spring.boot.bom)
    jooqCodegenImplementation 'org.jooq:jooq-codegen'
    jooqCodegenImplementation 'org.flywaydb:flyway-core'
    jooqCodegenImplementation 'org.testcontainers:testcontainers-postgresql'
    jooqCodegenRuntimeOnly 'org.flywaydb:flyway-database-postgresql'
    jooqCodegenRuntimeOnly 'org.postgresql:postgresql'
    jooqCodegenRuntimeOnly 'org.slf4j:slf4j-simple'

    jooqCodegenTestImplementation 'org.junit.jupiter:junit-jupiter'
    jooqCodegenTestImplementation 'org.assertj:assertj-core'
    jooqCodegenTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def testJooqCodegen = tasks.register('testJooqCodegen', Test) {
    description = 'Runs the jOOQ code generator\'s tests; those tagged container need Docker.'
    group = 'verification'
    testClassesDirs = sourceSets.jooqCodegenTest.output.classesDirs
    classpath = sourceSets.jooqCodegenTest.runtimeClasspath
    def image = rootProject.ext.postgresImage
    inputs.property('postgresImage', image)
    jvmArgumentProviders.add({ ["-Dpostgres.image=${image.get()}".toString()] } as CommandLineArgumentProvider)
}

def basePackage = project.group.toString()
def postgresImage = rootProject.ext.postgresImage
// Tables that belong to no business area, which generateJooq skips instead of failing on. Add one
// here in the change whose migration creates it (Flyway's own history table is always skipped).
def infrastructureTables = ['event_publication']
def migrations = layout.projectDirectory.dir('src/main/resources/db/migration')
def areas = project(':application-core').layout.projectDirectory.dir("src/main/java/${basePackage.replace('.', '/')}")
// The base package's sub-packages that are no business area; ArchitectureRules names the same two.
def nonAreaPackages = ['shared', 'web']
def areaNames = providers.provider {
    (areas.asFile.listFiles()?.findAll { it.isDirectory() }*.name ?: []).findAll { !(it in nonAreaPackages) }.sort()
}

def configureCodegen = { JavaExec task, String mode ->
    task.group = 'jooq'
    task.classpath = sourceSets.jooqCodegen.runtimeClasspath
    task.mainClass = 'io.scaffold.starter.codegen.JooqCodegen'
    task.jvmArgs '--enable-native-access=ALL-UNNAMED'
    task.systemProperty 'org.slf4j.simpleLogger.defaultLogLevel', 'warn'
    task.systemProperty 'org.jooq.no-logo', 'true'
    task.systemProperty 'org.jooq.no-tips', 'true'
    task.inputs.dir(migrations).withPathSensitivity(PathSensitivity.RELATIVE)
    task.inputs.property('areas', areaNames)
    task.inputs.property('basePackage', basePackage)
    task.inputs.property('postgresImage', postgresImage)
    task.inputs.property('infrastructureTables', infrastructureTables)
    task.argumentProviders.add({
        [mode, basePackage, postgresImage.get(), migrations.asFile.path, areaNames.get().join(','),
         generatedJooq.asFile.path, infrastructureTables.join(',')]
    } as CommandLineArgumentProvider)
}

tasks.register('generateJooq', JavaExec) {
    description = 'Regenerates src/generated/jooq from the Flyway migrations against a throwaway Postgres (needs Docker).'
    configureCodegen(it, 'generate')
    outputs.dir(generatedJooq)
}

def jooqCheckMarker = layout.buildDirectory.file('jooq-check/up-to-date')
def excludedTags = providers.gradleProperty('excludeTags')
    .map { tags -> tags.split(',').collect { it.trim() } }
    .orElse([])

def checkJooqGenerated = tasks.register('checkJooqGenerated', JavaExec) {
    description = 'Fails unless src/generated/jooq is what generateJooq produces from the migrations (needs Docker).'
    configureCodegen(it, 'check')
    inputs.files(generatedJooq).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.file(jooqCheckMarker)
    onlyIf('Docker is available (-PexcludeTags=container skips it)') { !excludedTags.get().contains('container') }
    doLast {
        jooqCheckMarker.get().asFile.text = 'ok\n'
    }
}

tasks.named('check') {
    dependsOn testJooqCodegen, checkJooqGenerated
}
