plugins {
    id 'java-conventions'
    alias(libs.plugins.spring.boot)
}

dependencies {
    implementation platform(libs.spring.boot.bom)
    implementation platform(libs.spring.modulith.bom)
    implementation project(':adapters')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    developmentOnly platform(libs.spring.boot.bom)
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    testImplementation 'org.springframework.boot:spring-boot-starter-jooq'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testImplementation platform(libs.jmolecules.bom)
    testImplementation 'org.jmolecules.integrations:jmolecules-archunit'
    testImplementation 'jakarta.persistence:jakarta.persistence-api' // negative architecture fixtures only
    testImplementation libs.archunit.junit5
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def frontendBrowser = layout.projectDirectory.dir('../../frontend/dist/scaffold-starter/browser')

tasks.named('processResources') {
    if (frontendBrowser.asFile.isDirectory()) {
        from(frontendBrowser) {
            into 'static'
        }
    }
}

// The root Dockerfile runs checkSpaPackaged before bootJar (docs/adr/0006).
def angularJson = layout.projectDirectory.file('../../frontend/angular.json')
def staticRoot = layout.buildDirectory.dir('resources/main/static')

// Without the SPA an image would pass its health check while serving no page.
def checkSpaPackaged = tasks.register('checkSpaPackaged') {
    description = 'Fails unless processResources packaged every locale build of the frontend.'
    dependsOn tasks.named('processResources')
    def angularFile = angularJson.asFile
    def staticDir = staticRoot.map { it.asFile }
    def frontendDir = frontendBrowser.asFile
    doLast {
        def i18n = new groovy.json.JsonSlurper().parse(angularFile).projects.values().first().i18n
        def source = i18n.sourceLocale instanceof Map ? i18n.sourceLocale.code : i18n.sourceLocale
        def locales = [source] + (i18n.locales?.keySet() ?: [])
        def missing = locales.findAll { !new File(staticDir.get(), "${it}/index.html").isFile() }
        if (missing) {
            throw new GradleException(
                    "The image would serve no SPA for ${missing.join(', ')}: ${frontendDir} has no build " +
                    'for it. Run `npm run build` in frontend/ first, then build the image again.')
        }
    }
}

// Spring Boot's plugin registers this task; the root Dockerfile builds the only image (docs/adr/0006).
tasks.named('bootBuildImage') {
    enabled = false
}
