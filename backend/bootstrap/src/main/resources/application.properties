spring.application.name=scaffold-starter
app.business-time-zone=UTC
spring.mvc.problemdetails.enabled=true
spring.docker.compose.file=../../compose.yaml
spring.modulith.events.jdbc.schema-initialization.enabled=false
spring.modulith.events.republish-outstanding-events-on-restart=true
# SpaWebConfig maps the locale builds; Boot's /** static mapping would shadow its redirect.
spring.web.resources.add-mappings=false
# jOOQ logs its banner and a "tip of the day" at INFO on first use.
logging.level.org.jooq.Constants=warn
