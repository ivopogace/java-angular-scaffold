// The image of compose.yaml's postgres service is the one Postgres image: bootRun and smoke-image.mjs
// (with the same lookup) run it, and generateJooq and the Testcontainers ITs receive it from here.
def postgresImageFromCompose = providers.fileContents(layout.projectDirectory.file('../compose.yaml')).asText.map { yaml ->
    def lines = yaml.readLines()
    def service = lines.findIndexOf { it ==~ /\s+postgres:\s*/ }
    if (service >= 0) {
        def indent = lines[service].indexOf(lines[service].trim())
        for (line in lines.drop(service + 1)) {
            if (!line.trim() || line.trim().startsWith('#')) {
                continue
            }
            if (line.indexOf(line.trim()) <= indent) {
                break
            }
            def image = line =~ /^\s*image:\s*["']?([^\s"'#]+)/
            if (image.find()) {
                return image.group(1)
            }
        }
    }
    throw new GradleException('compose.yaml has no postgres service with an image')
}

allprojects {
    group = 'io.scaffold.starter'
    version = '0.0.1-SNAPSHOT'
    ext.postgresImage = postgresImageFromCompose
}
